# ================================================
# 議事録エージェント設定ファイル
# ================================================

# ================================================
# 1. 音声処理設定
# ================================================
audio_extraction_enabled: false
  # 説明: 動画から音声を抽出するかどうか
  # true: 音声抽出を実行
  # false: 音声抽出をスキップ（テスト用）

transcription_enabled: false
  # 説明: 音声を文字起こしするかどうか
  # true: Groq Whisper APIで文字起こしを実行
  # false: ダミーテキストを使用

# ================================================
# 2. シーン検出設定
# ================================================
scene_detection_enabled: true
  # 説明: 動画からシーン/キーフレームを検出するかどうか
  # true: シーン検出を実行
  # false: スキップ

scene_detection_method: "transnetv2"
  # 説明: シーン検出の手法
  # "transnetv2": DeepLearning（高精度、推奨）
  # "opencv": OpenCVヒストグラム比較（高速、低精度）

# TransNetV2のパラメータ
transnetv2:
  # シーン境界の判定閾値（0.0-1.0）
  # NVIDIAのCOSMOの論文では、0.4が最適。
  # https://d1qx31qr3h6wln.cloudfront.net/publications/NVIDIA%20Cosmos_2.pdf
  #
  # 低い値（0.3）: より多くのシーン検出（false positiveが増える可能性）
  # 高い値（0.7）: 主要な切り替えのみ検出
  detection_threshold: 0.4

  # フレーム類似度レイヤーの使用
  # 動画内の視覚的な類似度を計算
  use_frame_similarity: true

  # 色ヒストグラムレイヤーの使用
  # 色分布の変化を検出
  use_color_histograms: true

# ================================================
# 3. 議事録生成設定
# ================================================
minutes_generation_enabled: false
  # 説明: 議事録を生成するかどうか
  # true: Qwen3-VLまたはOpenAIで生成
  # false: ダミーデータを使用

minutes_generation_method: "qwen3vl"
  # 説明: 議事録生成の手法
  # "qwen3vl": マルチモーダルLLM（画像+テキスト、推奨）
  # "openai": GPT-4テキストのみ

# ================================================
# 4. 画像処理設定
# ================================================
duplicate_removal_enabled: false
  # 説明: 重複する画像を削除するかどうか
  # true: 類似度95%以上の画像を削除
  # false: すべての検出画像を保存

image_saving_enabled: true
  # 説明: キーフレーム画像をディスクに保存するかどうか
  # true: outputs/フォルダに保存
  # false: スキップ

# ================================================
# 5. 画像アノテーション設定
# ================================================
annotation_enabled: true
  # 説明: 画像アノテーション機能を有効にするかどうか
  # true: LM Studio Qwen3-VL 8Bでアノテーションを実行
  # false: スキップ

lm_studio_endpoint: "http://localhost:1234/v1/chat/completions"
  # 説明: LM Studio APIエンドポイントURL

lm_studio_model: "unsloth/Qwen3-VL-8B-Instruct"
  # 説明: LM Studioで使用するモデル名

filtering_enabled: true
  # 説明: フレームフィルタリングを有効にするかどうか
  # true: 時間差 < filtering_min_time_gap_seconds のフレームを削除
  # false: フィルタリングを無効化（すべてのフレームを保持）

filtering_min_time_gap_seconds: 0.2
  # 説明: フレームフィルタリングの最小時間差（秒）
  # この値未満の時間差のフレームは削除される
  # 注意: この設定により、TransNetV2で検出されたフレーム数が減る可能性があります

batch_max_images: 6
  # 説明: バッチあたりの最大画像数

